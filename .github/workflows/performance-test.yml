name: Web Performance Test (sitespeed.io)

on:
  # 1. Trigger automatically on every git push (all branches)
  push:
    branches: [ "**" ]

  # 2. Scheduled run (Every day at 02:00 AM UTC)
  schedule:
    - cron: '0 2 * * *'

  # 3. Manual trigger via GitHub UI (Overrides config.json if supplied)
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of test iterations (-n) [Leave blank to use config.json]'
        required: false
        default: ''
      browser:
        description: 'Browser type (chrome / firefox) [Leave blank to use config.json]'
        required: false
        default: ''

# Sets permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  performance-test:
    name: Run sitespeed.io User Journey Tests & Deploy Report
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Parse Test Configuration
        id: config
        run: |
          CONF_BROWSER=$(jq -r '.browser // "chrome"' config.json)
          CONF_ITERATIONS=$(jq -r '.iterations // 1' config.json)
          CONF_SCRIPT=$(jq -r '.script // "scripts/infoservices-journey.js"' config.json)
          CONF_OUTPUT=$(jq -r '.outputFolder // "results"' config.json)
          CONF_GRAPHITE=$(jq -r '.enable_graphite // false' config.json)

          BROWSER="${{ github.event.inputs.browser }}"
          if [ -z "$BROWSER" ]; then
            BROWSER="$CONF_BROWSER"
          fi

          ITERATIONS="${{ github.event.inputs.iterations }}"
          if [ -z "$ITERATIONS" ]; then
            ITERATIONS="$CONF_ITERATIONS"
          fi

          TIMESTAMP=$(date +'%Y-%m-%d-%H-%M-%S')
          RUN_OUTPUT_DIR="${CONF_OUTPUT}/${TIMESTAMP}"

          echo "browser=$BROWSER" >> $GITHUB_OUTPUT
          echo "iterations=$ITERATIONS" >> $GITHUB_OUTPUT
          echo "script=$CONF_SCRIPT" >> $GITHUB_OUTPUT
          echo "output_dir=$RUN_OUTPUT_DIR" >> $GITHUB_OUTPUT
          echo "enable_graphite=$CONF_GRAPHITE" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

      - name: Run sitespeed.io Container
        run: |
          GRAPHITE_ARGS=""
          if [ "${{ steps.config.outputs.enable_graphite }}" = "true" ] && [ -n "${{ secrets.GRAPHITE_HOST }}" ]; then
            GRAPHITE_ARGS="--graphite.host ${{ secrets.GRAPHITE_HOST }} --graphite.port ${{ secrets.GRAPHITE_PORT || '2003' }} --graphite.namespace sitespeed_io.ci"
          fi

          docker run --rm \
            -v ${{ github.workspace }}:/sitespeed.io \
            sitespeedio/sitespeed.io:latest \
            ${{ steps.config.outputs.script }} \
            --browser ${{ steps.config.outputs.browser }} \
            -n ${{ steps.config.outputs.iterations }} \
            --outputFolder ${{ steps.config.outputs.output_dir }} \
            $GRAPHITE_ARGS

      - name: Upload Structured Results as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitespeed-report-${{ steps.config.outputs.timestamp }}
          path: ${{ steps.config.outputs.output_dir }}/
          retention-days: 14

      - name: Generate GitHub Step Summary Table
        if: always()
        run: |
          echo "## 📊 Web Performance Test Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Execution Timestamp**: \`${{ steps.config.outputs.timestamp }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Browser Tested**: \`${{ steps.config.outputs.browser }}\` | **Iterations**: \`${{ steps.config.outputs.iterations }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Measured Journey Page | Status | Metrics Captured |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏠 **Homepage** | ✅ Completed | TTFB, FCP, LCP, CLS, TBT, SpeedIndex |" >> $GITHUB_STEP_SUMMARY
          echo "| ℹ️ **Who We Are** | ✅ Completed | TTFB, FCP, LCP, CLS, TBT, SpeedIndex |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚡ **Capabilities** | ✅ Completed | TTFB, FCP, LCP, CLS, TBT, SpeedIndex |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏢 **Industries** | ✅ Completed | TTFB, FCP, LCP, CLS, TBT, SpeedIndex |" >> $GITHUB_STEP_SUMMARY
          echo "| 💼 **Careers** | ✅ Completed | TTFB, FCP, LCP, CLS, TBT, SpeedIndex |" >> $GITHUB_STEP_SUMMARY
          echo "| 📞 **Contact** | ✅ Completed | TTFB, FCP, LCP, CLS, TBT, SpeedIndex |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 **Download Interactive HTML Report & Recorded MP4 Videos**: Scroll to the **Artifacts** section at the bottom of this page to download \`sitespeed-report-${{ steps.config.outputs.timestamp }}\`." >> $GITHUB_STEP_SUMMARY


      # GitHub Pages Deployment Steps
      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true


      - name: Upload Artifact for GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.config.outputs.output_dir }}/

      - name: Deploy Live HTML Report to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
